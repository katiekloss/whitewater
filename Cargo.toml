[package]
name = "whitewater"
version = "0.1.0"
edition = "2024"
default-run = "whitewater"

[dependencies]
clap = { version = "4.5.53", features = ["derive"] }
prost = "0.14.1"
rmp-serde = "1.3.1"
serde = { version = "1.0.228", features = [ "derive" ] }
tokio = { version = "1.48.0", features = [ "full" ] }
tokio-stream = "0.1.18"
tonic = "0.14.2"
tonic-prost = "0.14.2"

[build-dependencies]
tonic-prost-build = "0.14.2"
